version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docusense-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: DocusenseDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Tmanna
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: docusense-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
